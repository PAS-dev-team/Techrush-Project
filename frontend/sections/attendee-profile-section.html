<!-- ==========================================
     MY PROFILE SECTION
========================================== -->

<div class="fade-in">

    <!-- Header -->

    <section class="glass-card section-header-card">

        <div class="section-header">

            <div>

                <h2>My Profile</h2>

                <p>
                    Manage your personal information and account details.
                </p>

            </div>

        </div>

    </section>


    <!-- Profile Card -->

    <section class="glass-card profile-page-card">

        <div class="profile-top">

            <div class="profile-page-avatar">

                <i class="fa-solid fa-user"></i>

            </div>

            <div>

                <h2 id="profileName">Prajwal Shewalkar</h2>

                <p>Attendee</p>

            </div>

        </div>


        <div class="profile-grid">

            <div class="profile-field">

                <label>Full Name</label>

                <input
                    type="text"
                    value="Prajwal Shewalkar"
                    readonly>

            </div>

            <div class="profile-field">

                <label>Email Address</label>

                <input
                    type="email"
                    value="prajwal@example.com"
                    readonly>

            </div>

            <div class="profile-field">

                <label>Department</label>

                <input
                    type="text"
                    value="Information Technology"
                    readonly>

            </div>

            <div class="profile-field">

                <label>Year</label>

                <input
                    type="text"
                    value="Second Year"
                    readonly>

            </div>

            <div class="profile-field">

                <label>Phone Number</label>

                <input
                    type="text"
                    value="+91 9876543210"
                    readonly>

            </div>

            <div class="profile-field">

                <label>College</label>

                <input
                    type="text"
                    value="Pune Institute of Computer Technology"
                    readonly>

            </div>

        </div>


        <div class="profile-actions">

            <button class="primary-btn">

                <i class="fa-solid fa-pen"></i>

                Edit Profile

            </button>

            <button class="secondary-btn">

                <i class="fa-solid fa-lock"></i>

                Change Password

            </button>

        </div>

    </section>

</div>
